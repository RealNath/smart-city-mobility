services:
  # MongoDB database
  mongo:
    image: mongo:7
    container_name: smart-city-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - smart-city-net

  # Express + Node.js backend
  backend:
    build:
      context: ./backend
    container_name: smart-city-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/smart-city
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      - mongo
    networks:
      - smart-city-net

  # Vue 3 frontend served by Nginx (proxies /api → backend)
  frontend:
    build:
      context: ./frontend
    container_name: smart-city-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - smart-city-net

volumes:
  mongo_data:

networks:
  smart-city-net:
    driver: bridge
